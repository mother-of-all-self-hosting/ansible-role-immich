---

- name: Ensure Immich paths exist
  when: item.when | bool
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0750"
    owner: "{{ immich_uid }}"
    group: "{{ immich_gid }}"
  with_items:
    - path: "{{ immich_base_path }}"
      when: true
    - path: "{{ immich_server_base_path }}"
      when: "{{ immich_server_enabled }}"
    - path: "{{ immich_server_data_path }}"
      when: "{{ immich_server_enabled }}"
    - path: "{{ immich_machine_learning_base_path }}"
      when: "{{ immich_machine_learning_enabled }}"
    - path: "{{ immich_machine_learning_cache_path }}"
      when: "{{ immich_machine_learning_enabled }}"
    - path: "{{ immich_machine_learning_dot_cache_path }}"
      when: "{{ immich_machine_learning_enabled }}"
    - path: "{{ immich_machine_learning_tmp_path }}"
      when: "{{ immich_machine_learning_enabled and not immich_machine_learning_container_tmpfs_tmp_enabled }}"

- name: Ensure Immich tmp path removed if tmp-on-tmpfs enabled
  when: immich_machine_learning_enabled and immich_machine_learning_container_tmpfs_tmp_enabled
  ansible.builtin.file:
    path: "{{ immich_machine_learning_tmp_path }}"
    state: absent

# We intentionally don't clean up:
# - `immich_server_base_path` if `not immich_server_enabled`
# - `immich_machine_learning_base_path` if `not immich_machine_learning_enabled`
# because we rely on uninstall.yml tasks to do it more cleanly.

- name: Ensure Immich support files installed
  when: item.when | bool
  ansible.builtin.template:
    src: "{{ role_path }}/{{ item.src }}"
    dest: "{{ item.dst }}"
    mode: "0640"
    owner: "{{ immich_uid }}"
    group: "{{ immich_gid }}"
  with_items:
    - src: templates/server/env.j2
      dst: "{{ immich_server_base_path }}/env"
      when: "{{ immich_server_enabled }}"
      component: server
    - src: templates/server/labels.j2
      dst: "{{ immich_server_base_path }}/labels"
      when: "{{ immich_server_enabled }}"
      component: server
    - src: templates/machine-learning/env.j2
      dst: "{{ immich_machine_learning_base_path }}/env"
      when: "{{ immich_machine_learning_enabled }}"
      component: machine_learning
  register: immich_support_files_result

- name: Ensure Immich container images are pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module' and item.when
  community.docker.docker_image_pull:
    name: "{{ item.image }}"
    pull: always
  register: immich_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: immich_container_image_pull_result_ansible_module is not failed
  with_items:
    - image: "{{ immich_server_container_image }}"
      when: "{{ immich_server_enabled }}"
      component: server
    - image: "{{ immich_machine_learning_container_image }}"
      when: "{{ immich_machine_learning_enabled }}"
      component: machine_learning

- name: Ensure Immich container images are pulled via command
  when: devture_systemd_docker_base_container_image_pull_method == 'command' and item.when
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ item.image }}"
  register: immich_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: immich_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in immich_container_image_pull_result_command.stdout"
  with_items:
    - image: "{{ immich_server_container_image }}"
      when: "{{ immich_server_enabled }}"
      component: server
    - image: "{{ immich_machine_learning_container_image }}"
      when: "{{ immich_machine_learning_enabled }}"
      component: machine_learning

- name: Ensure Immich container networks are created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ item }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: immich_network_creation_result_ansible_module
  with_items: "{{ immich_container_networks }}"

- name: Ensure Immich container networks are created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ item }}
  register: immich_network_creation_result_command
  changed_when: immich_network_creation_result_command.rc == 0
  failed_when: immich_network_creation_result_command.rc != 0 and 'already exists' not in immich_network_creation_result_command.stderr
  with_items: "{{ immich_container_networks }}"

- name: Ensure Immich systemd services are present
  when: item.when
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  with_items:
    - src: "{{ role_path }}/templates/server/immich-server.service.j2"
      dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ immich_server_identifier }}.service"
      when: "{{ immich_server_enabled }}"
      component: server
    - src: "{{ role_path }}/templates/machine-learning/immich-machine-learning.service.j2"
      dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ immich_machine_learning_identifier }}.service"
      when: "{{ immich_machine_learning_enabled }}"
      component: machine_learning
  register: immich_systemd_services_result

- name: Determine whether the Immich services need a restart
  ansible.builtin.set_fact:
    immich_server_restart_necessary: "{{ 'server' in immich_changed_components }}"
    immich_machine_learning_restart_necessary: "{{ 'machine_learning' in immich_changed_components }}"
  vars:
    immich_changed_components: >-
      {{
        (
          immich_support_files_result.results | default([])
          + immich_container_image_pull_result_ansible_module.results | default([])
          + immich_container_image_pull_result_command.results | default([])
          + immich_systemd_services_result.results | default([])
        )
        | selectattr('changed', 'defined') | selectattr('changed')
        | map(attribute='item.component') | list
        + (['server'] if immich_changed_networks | intersect([immich_server_container_network] + immich_server_container_additional_networks) | length > 0 else [])
        + (['machine_learning'] if immich_changed_networks | intersect([immich_machine_learning_container_network] + immich_machine_learning_container_additional_networks) | length > 0 else [])
      }}
    # When its settings differ, community.docker.docker_network removes and recreates a network,
    # and reconnects the running containers without their endpoint settings (such as network aliases).
    immich_changed_networks: >-
      {{
        (
          immich_network_creation_result_ansible_module.results | default([])
          + immich_network_creation_result_command.results | default([])
        )
        | selectattr('changed', 'defined') | selectattr('changed')
        | map(attribute='item') | list
      }}
